appId: com.lumen.browser
productName: Lumen
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - node_modules/better-sqlite3/**/*
  - package.json
asarUnpack:
  - "**/*.node"
linux:
  target:
    - AppImage
    - deb
    - pacman
    - rpm
    - snap
  category: Network
  icon: build/icon.png
win:
  target:
    - nsis
    - portable
  icon: build/icon.png
pacman:
  depends:
    - c-ares
    - ffmpeg
    - gtk3
    - libevent
    - libvpx
    - libxslt
    - libxss
    - minizip
    - nss
    - re2
    - snappy
    - libnotify
    - libsecret
