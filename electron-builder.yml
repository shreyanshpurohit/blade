appId: com.blade.browser
productName: Blade
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - node_modules/better-sqlite3/**/*
  - package.json
asarUnpack:
  - "**/*.node"
linux:
  target:
    - AppImage
    - deb
    - pacman
    - rpm
    - tar.gz
  category: Network
  icon: build/icon.png
deb:
  depends:
    - libnotify4
    - libsecret-1-0
    - libnss3
rpm:
  depends:
    - libnotify
    - libsecret
    - nss
pacman:
  depends:
    - c-ares
    - ffmpeg
    - gtk3
    - libevent
    - libvpx
    - libxslt
    - libxss
    - minizip
    - nss
    - re2
    - snappy
    - libnotify
    - libsecret
win:
  target:
    - nsis
    - portable
    - zip
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false

